<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TODO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <!-- NavBar -->

    <div class="toolbox-cont">
        <div class="toolbox-color-cont">
            <div class="lightpink color"></div>
            <div class="lightgreen color"></div>
            <div class="lightblue color"></div>
            <div class="black color"></div>
        </div>
        <div class="action-btn-cont">
            <div class="add-btn color"> 
                <i class="fa-sharp fa-solid fa-plus"></i>
            </div>

            <div class="remove-btn color">
                <i class="fa-sharp fa-solid fa-xmark"></i>
            </div>
        </div>
    </div>

    <!-- ToDo Box Space -->

    <div class="main-cont">

    </div>

    <!-- Modal Container -->

    <div class="modal-cont">
        <textarea placeholder="Enter Your Task"></textarea>
        <div class="priority-color-cont">
            <div class="lightpink priority-color"></div>
            <div class="lightgreen priority-color"></div>
            <div class="lightblue priority-color"></div>
            <div class="black priority-color"></div>
        </div>
    </div>

</body>
</html>
